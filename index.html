  async function loadTool(toolId) {
    const tool = tools.find(t => t.id === toolId);
    if(!tool) { renderHomepage(); return; }
    const app = document.getElementById('app-root');
    app.innerHTML = `<div class="tool-page" id="toolSpecificPage"></div><div id="toolPageAd" class="ad-slot" style="min-height:90px; margin-top:1rem;"></div><footer><p>© 2026 InstantEntry — All processing happens locally on your device.</p></footer>`;
    const container = document.getElementById('toolSpecificPage');
    container.innerHTML = `<h1 class="tool-title"><i class="${tool.icon}" style="margin-right:12px; color:${tool.color}"></i> ${tool.name}</h1><div class="tool-desc">${tool.desc}</div><div id="tool-ui"></div><button id="backHomeBtn" class="secondary" style="margin-top:1.5rem;"><i class="fas fa-arrow-left"></i> Back to all tools</button>`;
    document.getElementById('backHomeBtn')?.addEventListener('click', () => renderHomepage());
    const uiDiv = document.getElementById('tool-ui');
    switch(toolId) {
      case 'qr-generator': buildQRGenerator(uiDiv); break;
      case 'qr-reader': buildQRReader(uiDiv); break;
      case 'barcode-generator': buildBarcodeGen(uiDiv); break;
      case 'pdf-merger': buildPDFMerger(uiDiv); break;
      case 'pdf-to-text': buildPDFToText(uiDiv); break;
      case 'jpg-to-pdf': buildJPGtoPDF(uiDiv); break;
      case 'bg-remover': buildBgRemover(uiDiv); break;
      case 'image-upscaler': buildImageUpscaler(uiDiv); break;
      case 'case-converter': buildCaseConverter(uiDiv); break;
      case 'word-counter': buildWordCounter(uiDiv); break;
      case 'duplicate-remover': buildDuplicateRemover(uiDiv); break;
      default: uiDiv.innerHTML = '<p>Tool interface ready.</p>';
    }
    const toolAd = document.getElementById('toolPageAd');
    if(toolAd) {
      toolAd.innerHTML = '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5050545176887516" data-ad-slot="4444444444" data-ad-format="auto"></ins>';
      if(window.adsbygoogle) try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e){}
    }
    setActiveNav('home');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildQRGenerator(ui) { ui.innerHTML = `<label>Text or URL:</label><input type="text" id="qrText" value="https://instantentry.com"><div id="qrcodeContainer" style="margin:1rem 0; display:flex; justify-content:center;"></div><button id="genQRBtn">Generate QR Code</button>`; document.getElementById('genQRBtn').onclick = () => { const val = document.getElementById('qrText').value; const container = document.getElementById('qrcodeContainer'); container.innerHTML = ''; if(val) new QRCode(container, { text: val, width: 220, height: 220, colorDark: "#0052cc", colorLight: "#ffffff" }); }; document.getElementById('genQRBtn').click(); }
  function buildQRReader(ui) { ui.innerHTML = `<div id="qr-reader-container" style="width:100%; max-width:500px;"></div><input type="file" id="qrImageUpload" accept="image/*"><div class="result-area"><strong>Decoded:</strong> <span id="decodedText">-</span></div>`; const html5QrCode = new Html5Qrcode("qr-reader-container"); document.getElementById('qrImageUpload').onchange = (e) => { if(e.target.files[0]) html5QrCode.scanFile(e.target.files[0], true).then(d => document.getElementById('decodedText').innerText = d).catch(()=>document.getElementById('decodedText').innerText="No QR"); }; const btn = document.createElement('button'); btn.innerText = "Start Camera"; btn.onclick = () => html5QrCode.start({ facingMode: "environment" }, { fps: 10 }, (d) => document.getElementById('decodedText').innerText = d); ui.appendChild(btn); }
  function buildBarcodeGen(ui) { ui.innerHTML = `<input id="barcodeData" placeholder="Data" value="INSTANT-001"><canvas id="barcodeCanvas" style="margin:1rem 0;"></canvas><button id="drawBarcode">Generate</button>`; document.getElementById('drawBarcode').onclick = () => JsBarcode(document.getElementById('barcodeCanvas'), document.getElementById('barcodeData').value, { format: "CODE128", lineColor: "#0052cc", width: 2, height: 80 }); document.getElementById('drawBarcode').click(); }
  async function buildPDFMerger(ui) { ui.innerHTML = `<input type="file" id="pdfInput1" accept=".pdf" multiple><button id="mergeBtn">Merge PDFs</button><div id="mergeResult"></div>`; document.getElementById('mergeBtn').onclick = async () => { const files = document.getElementById('pdfInput1').files; if(files.length<2) { document.getElementById('mergeResult').innerHTML="Select ≥2 PDFs"; return; } const { PDFDocument } = PDFLib; const merged = await PDFDocument.create(); for(const f of files) { const pdf=await PDFDocument.load(await f.arrayBuffer()); const pages=await merged.copyPages(pdf, pdf.getPageIndices()); pages.forEach(p=>merged.addPage(p)); } const blob=new Blob([await merged.save()], {type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='merged.pdf'; a.click(); document.getElementById('mergeResult').innerHTML="✅ Merged PDF ready"; }; }
  async function buildPDFToText(ui) { ui.innerHTML = `<input type="file" id="pdfTextFile" accept=".pdf"><button id="extractBtn">Extract Text</button><div id="textOutput" class="result-area"></div>`; window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"; document.getElementById('extractBtn').onclick = async () => { const file = document.getElementById('pdfTextFile').files[0]; if(!file) return; const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; let text=""; for(let i=1;i<=pdf.numPages;i++) { const page=await pdf.getPage(i); const content=await page.getTextContent(); text+=content.items.map(c=>c.str).join(' ')+"\n"; } document.getElementById('textOutput').innerHTML = `<pre style="white-space:pre-wrap">${text.substring(0,3000)}</pre>`; }; }
  async function buildJPGtoPDF(ui) { ui.innerHTML = `<input type="file" id="jpgFiles" accept="image/*" multiple><button id="convertToPdf">Convert to PDF</button>`; document.getElementById('convertToPdf').onclick = async () => { const files = Array.from(document.getElementById('jpgFiles').files); if(!files.length) return; const { PDFDocument } = PDFLib; const pdfDoc = await PDFDocument.create(); for(const f of files) { const bytes = await f.arrayBuffer(); const image = f.type.includes('jpeg') ? await pdfDoc.embedJpg(bytes) : await pdfDoc.embedPng(bytes); const page = pdfDoc.addPage([image.width, image.height]); page.drawImage(image, { x:0, y:0, width:image.width, height:image.height }); } const blob = new Blob([await pdfDoc.save()], {type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='images.pdf'; a.click(); }; }
  function buildBgRemover(ui) { ui.innerHTML = `<input type="file" id="bgImage" accept="image/*"><button id="removeBgBtn">Remove Background</button><img id="bgPreview" class="preview-img">`; document.getElementById('removeBgBtn').onclick = async () => { const file = document.getElementById('bgImage').files[0]; if(!file) return; const img = new Image(); img.src = URL.createObjectURL(file); img.onload = async () => { const blob = await window.removeBackground(img); document.getElementById('bgPreview').src = URL.createObjectURL(blob); }; }; }
  function buildImageUpscaler(ui) { ui.innerHTML = `<input type="file" id="upscaleImage" accept="image/*"><button id="upscaleBtn">2x Upscale</button><canvas id="upscaledCanvas" style="max-width:100%; margin-top:1rem;"></canvas>`; document.getElementById('upscaleBtn').onclick = () => { const file = document.getElementById('upscaleImage').files[0]; if(!file) return; const img = new Image(); img.onload = () => { const c=document.getElementById('upscaledCanvas'); c.width=img.width*2; c.height=img.height*2; c.getContext('2d').drawImage(img,0,0,c.width,c.height); }; img.src = URL.createObjectURL(file); }; }
  function buildCaseConverter(ui) { ui.innerHTML = `<textarea id="caseInput" rows="4" placeholder="Enter text..."></textarea><button id="upperBtn">UPPER</button><button id="lowerBtn">lower</button><button id="titleBtn">Title Case</button><div class="result-area" id="caseOutput"></div>`; const inp=()=>document.getElementById('caseInput').value; document.getElementById('upperBtn').onclick=()=>document.getElementById('caseOutput').innerText=inp().toUpperCase(); document.getElementById('lowerBtn').onclick=()=>document.getElementById('caseOutput').innerText=inp().toLowerCase(); document.getElementById('titleBtn').onclick=()=>document.getElementById('caseOutput').innerText=inp().replace(/\b\w/g,l=>l.toUpperCase()); }
  function buildWordCounter(ui) { ui.innerHTML = `<textarea id="wordTextArea" rows="5" placeholder="Type something..."></textarea><div class="result-area" id="statsArea">Characters: 0 | Words: 0 | Sentences: 0</div>`; const area=document.getElementById('wordTextArea'); area.addEventListener('input',()=>{ const t=area.value; const c=t.length; const w=t.trim()?t.trim().split(/\s+/).length:0; const s=t.split(/[.!?]+/).filter(s=>s.trim().length>0).length; document.getElementById('statsArea').innerText=`Characters: ${c} | Words: ${w} | Sentences: ${s}`; }); }
  function buildDuplicateRemover(ui) { ui.innerHTML = `<textarea id="dupInput" rows="6" placeholder="Paste list (one per line)"></textarea><button id="removeDupBtn">Remove Duplicates</button><div class="result-area" id="cleanOutput"></div>`; document.getElementById('removeDupBtn').onclick = () => { const lines = document.getElementById('dupInput').value.split(/\r?\n/); const unique = [...new Map(lines.map(l=>[l,l])).values()]; document.getElementById('cleanOutput').innerHTML = unique.join('<br>') + `<br><button id="copyCleanBtn">Copy</button>`; document.getElementById('copyCleanBtn')?.addEventListener('click',()=>navigator.clipboard.writeText(unique.join('\n'))); }; }

  function navigateTo(page) {
    if(page === 'home') renderHomepage();
    else if(page === 'privacy') renderPrivacy();
    else if(page === 'terms') renderTerms();
    else if(page === 'about') renderAbout();
    else if(page === 'contact') renderContact();
    else renderHomepage();
  }

  document.querySelectorAll('.nav-item').forEach(link => {
    link.addEventListener('click', (e) => { e.preventDefault(); navigateTo(link.getAttribute('data-page')); });
  });
  document.getElementById('homeLink')?.addEventListener('click', (e) => { e.preventDefault(); navigateTo('home'); });

  renderHomepage();
</script>
