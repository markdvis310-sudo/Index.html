  function buildImageEditor(ui) { ui.innerHTML = `<input type="file" id="editImg" accept="image/*"><canvas id="editCanvas" style="max-width:100%; margin-top:1rem; border-radius:16px; border:1px solid #e2e8f0;"></canvas><div><button id="grayBtn">Grayscale</button><button id="sepiaBtn">Sepia</button><button id="invertBtn">Invert</button><button id="resetBtn">Reset</button></div><button id="downloadEdit">Download</button>`; let img = new Image(); let canvas = document.getElementById('editCanvas'); let ctx = canvas.getContext('2d'); let originalImg = null; document.getElementById('editImg').onchange = (e) => { const file = e.target.files[0]; if(file) { img.src = URL.createObjectURL(file); img.onload = () => { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img,0,0); originalImg = ctx.getImageData(0,0,canvas.width,canvas.height); }; } }; const applyFilter = (filter) => { if(originalImg) { ctx.putImageData(originalImg,0,0); let idata = ctx.getImageData(0,0,canvas.width,canvas.height); for(let i=0;i<idata.data.length;i+=4){ if(filter==='gray'){ let g=0.34*idata.data[i]+0.5*idata.data[i+1]+0.16*idata.data[i+2]; idata.data[i]=g; idata.data[i+1]=g; idata.data[i+2]=g; } else if(filter==='sepia'){ let r=idata.data[i],g=idata.data[i+1],b=idata.data[i+2]; idata.data[i]=Math.min(255,r*0.393+g*0.769+b*0.189); idata.data[i+1]=Math.min(255,r*0.349+g*0.686+b*0.168); idata.data[i+2]=Math.min(255,r*0.272+g*0.534+b*0.131); } else if(filter==='invert'){ idata.data[i]=255-idata.data[i]; idata.data[i+1]=255-idata.data[i+1]; idata.data[i+2]=255-idata.data[i+2]; } } ctx.putImageData(idata,0,0); } }; document.getElementById('grayBtn').onclick = () => applyFilter('gray'); document.getElementById('sepiaBtn').onclick = () => applyFilter('sepia'); document.getElementById('invertBtn').onclick = () => applyFilter('invert'); document.getElementById('resetBtn').onclick = () => { if(originalImg) ctx.putImageData(originalImg,0,0); }; document.getElementById('downloadEdit').onclick = () => { const link = document.createElement('a'); link.download = 'edited.png'; link.href = canvas.toDataURL(); link.click(); }; }
  function buildImageFilters(ui) { ui.innerHTML = `<input type="file" id="filterImg" accept="image/*"><canvas id="filterCanvas" style="max-width:100%;"></canvas><label>Brightness: <input type="range" id="brightness" min="0" max="200" value="100"></label><label>Contrast: <input type="range" id="contrast" min="0" max="200" value="100"></label><button id="applyFilters">Apply</button><button id="downloadFilter">Download</button>`; let img = new Image(); let canvas = document.getElementById('filterCanvas'); let ctx = canvas.getContext('2d'); document.getElementById('filterImg').onchange = (e) => { const file = e.target.files[0]; if(file) { img.src = URL.createObjectURL(file); img.onload = () => { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img,0,0); }; } }; document.getElementById('applyFilters').onclick = () => { ctx.drawImage(img,0,0,canvas.width,canvas.height); let b = document.getElementById('brightness').value / 100; let c = document.getElementById('contrast').value / 100; let idata = ctx.getImageData(0,0,canvas.width,canvas.height); for(let i=0;i<idata.data.length;i+=4){ idata.data[i] = Math.min(255, ((idata.data[i]-128)*c + 128)*b); idata.data[i+1] = Math.min(255, ((idata.data[i+1]-128)*c + 128)*b); idata.data[i+2] = Math.min(255, ((idata.data[i+2]-128)*c + 128)*b); } ctx.putImageData(idata,0,0); }; document.getElementById('downloadFilter').onclick = () => { const link = document.createElement('a'); link.download = 'filtered.png'; link.href = canvas.toDataURL(); link.click(); }; }

  function buildImageGenerator(ui) { ui.innerHTML = `<select id="genStyle"><option value="gradient">Gradient</option><option value="stripes">Stripes</option><option value="dots">Dots</option></select><label>Color 1: <input type="color" id="genColor1" value="#3b82f6"></label><label>Color 2: <input type="color" id="genColor2" value="#8b5cf6"></label><button id="generateImg">Generate Image</button><canvas id="genCanvas" width="400" height="300" style="max-width:100%; border-radius:16px;"></canvas><button id="downloadGenImg">Download</button>`; const canvas = document.getElementById('genCanvas'); const ctx = canvas.getContext('2d'); document.getElementById('generateImg').onclick = () => { const style = document.getElementById('genStyle').value; const c1 = document.getElementById('genColor1').value; const c2 = document.getElementById('genColor2').value; if(style === 'gradient') { const grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height); grad.addColorStop(0,c1); grad.addColorStop(1,c2); ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height); } else if(style === 'stripes') { ctx.fillStyle = c1; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = c2; for(let i=0;i<canvas.width;i+=40){ ctx.fillRect(i,0,20,canvas.height); } } else { ctx.fillStyle = c1; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = c2; for(let i=0;i<canvas.width;i+=30){ for(let j=0;j<canvas.height;j+=30){ ctx.beginPath(); ctx.arc(i+10,j+10,8,0,Math.PI*2); ctx.fill(); } } } }; document.getElementById('downloadGenImg').onclick = () => { const link = document.createElement('a'); link.download = 'generated.png'; link.href = canvas.toDataURL(); link.click(); }; }

  function buildJSONtoCSV(ui) { ui.innerHTML = `<textarea id="jsonCsvInput" rows="6" placeholder='[{"name":"John","age":25},{"name":"Jane","age":30}]'></textarea><button id="jsonToCsvBtn">Convert JSON to CSV</button><div class="result-area" id="jsonCsvOut"></div>`; document.getElementById('jsonToCsvBtn').onclick = () => { try { const data = JSON.parse(document.getElementById('jsonCsvInput').value); if(!Array.isArray(data) || data.length===0) throw new Error(); const headers = Object.keys(data[0]); const csvRows = [headers.join(',')]; for(const row of data) { const values = headers.map(h => row[h] !== undefined ? row[h] : ''); csvRows.push(values.join(',')); } document.getElementById('jsonCsvOut').innerText = csvRows.join('\n'); } catch(e) { document.getElementById('jsonCsvOut').innerText = "Invalid JSON array"; } }; }
  function buildHexToRGB(ui) { ui.innerHTML = `<input id="hexInput" placeholder="#3b82f6"><button id="hexToRgbBtn">Convert HEX to RGB</button><div class="result-area" id="hexRgbOut"></div>`; document.getElementById('hexToRgbBtn').onclick = () => { let hex = document.getElementById('hexInput').value; hex = hex.replace('#',''); if(hex.length===3) hex = hex.split('').map(c=>c+c).join(''); if(hex.length!==6) { document.getElementById('hexRgbOut').innerText = "Invalid HEX color"; return; } const r = parseInt(hex.substring(0,2),16); const g = parseInt(hex.substring(2,4),16); const b = parseInt(hex.substring(4,6),16); document.getElementById('hexRgbOut').innerHTML = `RGB: ${r}, ${g}, ${b}<br>HEX: #${hex}`; }; }
  function buildRGBToHex(ui) { ui.innerHTML = `<input id="rInput" placeholder="R (0-255)" type="number"><input id="gInput" placeholder="G (0-255)" type="number"><input id="bInput" placeholder="B (0-255)" type="number"><button id="rgbToHexBtn">Convert RGB to HEX</button><div class="result-area" id="rgbHexOut"></div>`; document.getElementById('rgbToHexBtn').onclick = () => { const r = parseInt(document.getElementById('rInput').value); const g = parseInt(document.getElementById('gInput').value); const b = parseInt(document.getElementById('bInput').value); if(isNaN(r)||isNaN(g)||isNaN(b)||r<0||r>255||g<0||g>255||b<0||b>255) { document.getElementById('rgbHexOut').innerText = "Enter valid RGB values (0-255)"; return; } const hex = '#' + [r,g,b].map(x => { const hex = x.toString(16); return hex.length===1 ? '0'+hex : hex; }).join(''); document.getElementById('rgbHexOut').innerHTML = `HEX: ${hex.toUpperCase()}<br>RGB: ${r}, ${g}, ${b}`; }; }
  function buildLineCounter(ui) { ui.innerHTML = `<textarea id="lineCountInput" rows="6" placeholder="Paste text to count lines..."></textarea><button id="countLinesBtn">Count Lines</button><div class="result-area" id="lineCountOut"></div>`; document.getElementById('countLinesBtn').onclick = () => { const text = document.getElementById('lineCountInput').value; const lines = text.split(/\r?\n/); const totalLines = lines.length; const nonEmpty = lines.filter(l=>l.trim().length>0).length; document.getElementById('lineCountOut').innerHTML = `Total lines: ${totalLines}<br>Non-empty lines: ${nonEmpty}`; }; }
  function buildRemoveWhitespace(ui) { ui.innerHTML = `<textarea id="wsInput" rows="6" placeholder="Paste text with extra spaces..."></textarea><button id="removeWsBtn">Remove Extra Whitespace</button><div class="result-area" id="wsOut"></div>`; document.getElementById('removeWsBtn').onclick = () => { let text = document.getElementById('wsInput').value; text = text.replace(/\s+/g, ' ').trim(); document.getElementById('wsOut').innerText = text; }; }

  function navigateTo(page) {
    if(page === 'home') renderHomepage();
    else if(page === 'privacy') renderPrivacy();
    else if(page === 'terms') renderTerms();
    else if(page === 'about') renderAbout();
    else if(page === 'contact') renderContact();
    else renderHomepage();
  }
  document.querySelectorAll('.nav-item').forEach(link => { link.addEventListener('click', (e) => { e.preventDefault(); navigateTo(link.getAttribute('data-page')); if(document.getElementById('navLinks')) document.getElementById('navLinks').classList.remove('show'); }); });
  document.getElementById('homeLink')?.addEventListener('click', (e) => { e.preventDefault(); navigateTo('home'); });
  document.getElementById('menuToggle')?.addEventListener('click', () => { document.getElementById('navLinks').classList.toggle('show'); });
  renderHomepage();
</script>
</body>
